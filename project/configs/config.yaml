# Базовая конфигурация для обучения и инференса

dataset:
  id: "DrBimmer/car-parts-and-damage-dataset"
  val_size: 0.2
  seed: 42

model:
  name: "maskrcnn_resnet50_fpn_v2"
  num_classes: 30 # 29 + background
  score_threshold: 0.5

training:
  epochs: 20
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"

api:
  host: "0.0.0.0"
  port: 8000
